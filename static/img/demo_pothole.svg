<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="hole" cx="48%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="70%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#road)" />
  <!-- Road lane markings -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#f1f5f9" stroke-width="8" stroke-dasharray="35 30" stroke-opacity="0.4" />
  <!-- Asphalt texture cracks -->
  <path d="M 160 180 Q 210 195 240 185 T 320 210" stroke="#0f172a" stroke-width="3" fill="none" opacity="0.8" />
  <!-- Deep pothole cavity -->
  <path d="M 230 180 Q 320 150 410 185 Q 460 220 420 260 Q 340 290 240 270 Q 180 230 230 180 Z" fill="url(#hole)" stroke="#475569" stroke-width="4" />
  <!-- Inner depth edge -->
  <path d="M 250 200 Q 330 180 390 200 Q 420 230 380 250 Q 320 270 260 255 Z" fill="#030712" opacity="0.9" />
  <!-- AI Detection Overlay Box -->
  <rect x="180" y="140" width="280" height="150" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" rx="6" />
  <rect x="180" y="112" width="170" height="26" fill="#ef4444" rx="4" />
  <text x="190" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">POTHOLE • CRITICAL 94%</text>
</svg>
