<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#334155" />
  <!-- Ground and sidewalk -->
  <rect x="0" y="320" width="600" height="80" fill="#1e293b" />
  <!-- Bent pole -->
  <path d="M 300 350 L 300 240 L 335 120" stroke="#94a3b8" stroke-width="16" fill="none" stroke-linecap="round" />
  <!-- Stop sign attached at angle -->
  <g transform="translate(265, 30) rotate(18, 70, 70)">
    <polygon points="41,0 99,0 140,41 140,99 99,140 41,140 0,99 0,41" fill="#dc2626" stroke="#ffffff" stroke-width="5" />
    <text x="70" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">STOP</text>
  </g>
  <!-- AI Detection Overlay Box -->
  <rect x="230" y="20" width="180" height="230" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" rx="6" />
  <rect x="230" y="0" width="190" height="24" fill="#ea580c" rx="4" />
  <text x="240" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DAMAGED SIGN • HIGH 91%</text>
</svg>
